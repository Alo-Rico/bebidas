<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Menú Alo Rico - Bebidas</title>

<link rel="stylesheet" href="estyles.css">

</head>

<body style="--bg-image:url('https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?q=80&w=1600&auto=format&fit=crop');">

<header>

<img src="logo.png" class="logo">

<h1>Menú de Bebidas</h1>

<img src="Repartidor.png" class="icono">

</header>

<div id="menu" class="menu-container"></div>

<!-- MODAL -->

<div id="modal">

<div class="modal-content">

<h3 id="modal-titulo"></h3>

<input type="number" id="cantidad-input" value="1" min="1">

<br><br>

<button onclick="confirmarCantidad()"
style="background:#22c55e;color:white;padding:12px 18px;border:none;border-radius:12px;font-weight:bold;">
Agregar
</button>

<button onclick="cerrarModal()"
style="background:#ef4444;color:white;padding:12px 18px;border:none;border-radius:12px;font-weight:bold;">
Cancelar
</button>

</div>

</div>

<!-- TOTAL -->

<div id="mensaje-total">
💰 Total: Gs. 0
</div>

<!-- BOTONES -->

<div class="btn-grid">

<button id="btnPizza" class="btn-flotante">
PIZZAS
</button>

<button id="btnHamburguesas" class="btn-flotante">
HAMBURGUESAS
</button>

<button id="btnLomitos" class="btn-flotante">
LOMITOS
</button>

<button id="btnCarrito" class="btn-flotante">
MI PEDIDO
</button>

</div>

<!-- PEDIDO -->

<div id="pedido-flotante">

<h3 id="titulo-pedido">
Mi Pedido
</h3>

<ul id="lista-pedido"></ul>

<p id="total-pedido"></p>

<div class="acciones-pedido">

<button id="btn-borrar">
Borrar
</button>

<button id="enviar-whatsapp">
Enviar pedido
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
 getDatabase,
 ref,
 push,
 onValue,
 remove
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

/* MESA */

const params =
new URLSearchParams(window.location.search);

const mesa =
params.get("mesa") || "PEDIDO DESDE CASA";

/* FIREBASE */

const app = initializeApp({

 apiKey: "AIzaSyADGYsqhbCFuKj2fXpontLpND_rtT7Nlno",

 authDomain: "alorico-59754.firebaseapp.com",

 databaseURL: "https://alorico-59754-default-rtdb.firebaseio.com",

 projectId: "alorico-59754"
});

const db = getDatabase(app);

/* CLIENTE */

const clienteId =
"mesa_" + mesa;

const pedidoRef =
ref(db,"pedidos/" + clienteId);

/* TITULO */

document.getElementById("titulo-pedido")
.innerText =
`Mi Pedido - Mesa ${mesa}`;

/* BOTONES */

document.getElementById("btnPizza").onclick = ()=>{

 location.href =
 `https://alo-rico.github.io/pizza/?mesa=${mesa}`;
};

document.getElementById("btnHamburguesas").onclick = ()=>{

 location.href =
 `https://alo-rico.github.io/hamburguesa/?mesa=${mesa}`;
};

document.getElementById("btnLomitos").onclick = ()=>{

 location.href =
 `https://alo-rico.github.io/lomitos/?mesa=${mesa}`;
};

document.getElementById("btnCarrito").onclick = ()=>{

 const p =
 document.getElementById("pedido-flotante");

 p.classList.toggle("activo");

 if(p.classList.contains("activo")){

  setTimeout(()=>{

   p.classList.remove("activo");

  },7000);
 }
};

/* PEDIDO */

onValue(pedidoRef,(snap)=>{

 const data = snap.val();

 let total = 0;

 const lista =
 document.getElementById("lista-pedido");

 lista.innerHTML = "";

 if(data){

  Object.entries(data).forEach(([k,p])=>{

   total += p.precio * p.cantidad;

   const li =
   document.createElement("li");

   li.className = "item-pedido";

li.innerHTML = `
    <span>
      ${p.nombre} x${p.cantidad}
      <br>
      <strong>
        Gs. ${(p.precio * p.cantidad).toLocaleString()}
      </strong>
    </span>

    <button class="btn-eliminar">
      🗑
    </button>
   `;

   li.querySelector("button").onclick = ()=>{

    remove(
      ref(db,"pedidos/" + clienteId + "/" + k)
    );
   };

   lista.appendChild(li);
  });
 }

 document.getElementById("total-pedido")
 .innerText =
 "Total: Gs. " + total.toLocaleString();

 const mensaje =
 document.getElementById("mensaje-total");

 if(total > 0){

  mensaje.style.display = "block";

  mensaje.innerText =
  `💰 Mesa ${mesa} - Total: Gs. ${total.toLocaleString()}`;

 }else{

  mensaje.style.display = "none";
 }
});

/* BORRAR */

document.getElementById("btn-borrar").onclick = ()=>{

 remove(pedidoRef);
};

/* WHATSAPP */

document.getElementById("enviar-whatsapp").onclick = ()=>{

 onValue(pedidoRef,(snap)=>{

  const d = snap.val();

  if(!d){

   alert("Sin pedido");

   return;
  }

  let txt = "";

  let total = 0;

  Object.values(d).forEach(p=>{

  txt += `- ${p.nombre} x${p.cantidad} - Gs. ${(p.precio * p.cantidad).toLocaleString()}%0A`;

   total += p.precio * p.cantidad;
  });

  const mensaje =
  `Hola envio mi pedido - Mesa ${mesa}:%0A${txt}%0ATotal: Gs. ${total.toLocaleString()}`;

window.open(
 `https://wa.me/+595971891251?text=${mensaje}`
);

remove(pedidoRef);

document.getElementById("pedido-flotante")
.classList.remove("activo");

 },{onlyOnce:true});
};

/* MENU FIREBASE */

const menuRef =
ref(db,"productos");

onValue(menuRef,(snap)=>{

 const data = snap.val();

 const menu =
 document.getElementById("menu");

 menu.innerHTML = "";

 if(data){

  Object.values(data).forEach((i)=>{

   if(i.categoria !== "bebidas") return;

   const div =
   document.createElement("div");

   div.className = "product";

   div.innerHTML = `
    <img src="${i.imagen}">
    <h3>${i.nombre}</h3>
    <p>Gs. ${Number(i.precio).toLocaleString()}</p>
   `;

   div.onclick = ()=>{

    abrirModal(
      i.nombre,
      Number(i.precio)
    );
   };

   menu.appendChild(div);
  });
 }
});

/* MODAL */

let seleccionado = {};

window.abrirModal = (n,p)=>{

 seleccionado = {
  nombre:n,
  precio:p
 };

 document.getElementById("modal-titulo")
 .innerText = n;

 document.getElementById("cantidad-input")
 .value = 1;

 document.getElementById("modal")
 .style.display = "flex";
};

window.cerrarModal = ()=>{

 document.getElementById("modal")
 .style.display = "none";
};

window.confirmarCantidad = ()=>{

 const c =
 parseInt(
  document.getElementById("cantidad-input").value
 ) || 1;

 push(pedidoRef,{
  ...seleccionado,
  cantidad:c
 });

 cerrarModal();
};

</script>

</body>
</html>
